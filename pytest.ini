[pytest]
# PR-C7 task 4.0: pytest markers (see docs/planning/gui-api-refactor-plan.md section 5.3)
markers =
    api: API layer unit tests (plan requires 100% coverage)
    integration: integration tests
    smoke: import / instance smoke tests
    slow: tests over 1 second
    cli: CLI smoke tests (PR-C8, plan §6.3)

# Restrict test search to tests/ only (root has docs/ scripts/ etc.)
testpaths = tests

# Default: -ra (show all results) + -q (quiet, errors still detailed)
# --continue-on-collection-errors: missing imports (e.g. PyQt6 in headless env)
#   don't abort collection; show as warnings so -m filter still works
addopts = -ra -q --continue-on-collection-errors
